<svg viewBox="0 0 880 1250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f5a623"/>
    </marker>
    <style>
      .box { fill: #171b28; stroke: #2a3145; stroke-width: 1.4; }
      .title { fill: #eceef4; font-size: 16px; font-weight: 700; }
      .subtitle { fill: #9aa3b8; font-size: 12px; }
      .flow { stroke: #f5a623; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .edgelabel { fill: #6b7280; font-size: 11.5px; }
      .icon { stroke: #f5a623; fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .heading { fill: #1a1d29; font-size: 22px; font-weight: 700; }
      .subheading { fill: #6b7280; font-size: 13px; font-style: italic; }
      .section { fill: #1a1d29; font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="1250" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" class="heading">WAPEXP Chatbot — System Architecture</text>
  <text x="440" y="50" text-anchor="middle" class="subheading">Request flow from the browser to a grounded AI response</text>

  <rect x="290" y="80" width="300" height="80" rx="14" class="box"/>
  <g transform="translate(306,96)">
    <rect x="0" y="0" width="24" height="18" rx="2" class="icon"/>
    <line x1="0" y1="6" x2="24" y2="6" class="icon"/>
    <circle cx="4" cy="3" r="0.9" fill="#f5a623"/>
    <circle cx="8" cy="3" r="0.9" fill="#f5a623"/>
  </g>
  <text x="342" y="112" class="title">User Browser</text>
  <text x="342" y="130" class="subtitle">HTML / CSS / JavaScript frontend</text>

  <rect x="290" y="230" width="300" height="80" rx="14" class="box"/>
  <g transform="translate(306,246)">
    <rect x="0" y="0" width="24" height="6" rx="1.5" class="icon"/>
    <rect x="0" y="9" width="24" height="6" rx="1.5" class="icon"/>
    <rect x="0" y="18" width="24" height="6" rx="1.5" class="icon"/>
    <circle cx="4" cy="3" r="1" fill="#f5a623"/>
    <circle cx="4" cy="12" r="1" fill="#f5a623"/>
    <circle cx="4" cy="21" r="1" fill="#f5a623"/>
  </g>
  <text x="342" y="262" class="title">FastAPI Backend</text>
  <text x="342" y="280" class="subtitle">REST endpoint — POST /api/chat</text>

  <rect x="290" y="380" width="300" height="80" rx="14" class="box"/>
  <g transform="translate(306,396)">
    <path d="M12 1 L22 5 V12 C22 18 17 22 12 23 C7 22 2 18 2 12 V5 Z" class="icon"/>
    <path d="M7 12 L10.5 15.5 L17 8" class="icon"/>
  </g>
  <text x="342" y="412" class="title">Security Layer</text>
  <text x="342" y="430" class="subtitle">Rate limiter + input sanitizer</text>

  <rect x="290" y="530" width="300" height="80" rx="14" class="box"/>
  <g transform="translate(306,546)">
    <path d="M12 2 L22 7 L12 12 L2 7 Z" class="icon"/>
    <path d="M2 12 L12 17 L22 12" class="icon"/>
    <path d="M2 17 L12 22 L22 17" class="icon"/>
  </g>
  <text x="342" y="562" class="title">Session Memory</text>
  <text x="342" y="580" class="subtitle">Recent conversation context</text>

  <rect x="60" y="700" width="310" height="90" rx="14" class="box"/>
  <g transform="translate(76,716)">
    <ellipse cx="12" cy="5" rx="10" ry="4" class="icon"/>
    <path d="M2 5 V19 C2 21.2 6.5 23 12 23 C17.5 23 22 21.2 22 19 V5" class="icon"/>
    <path d="M2 12 C2 14.2 6.5 16 12 16 C17.5 16 22 14.2 22 12" class="icon"/>
  </g>
  <text x="112" y="732" class="title">Vector Search</text>
  <text x="112" y="750" class="subtitle">ChromaDB + embedding model</text>
  <text x="112" y="768" class="subtitle">(semantic similarity)</text>

  <rect x="510" y="700" width="310" height="90" rx="14" class="box"/>
  <g transform="translate(526,716)">
    <circle cx="10" cy="10" r="8" class="icon"/>
    <line x1="16" y1="16" x2="22" y2="22" class="icon"/>
  </g>
  <text x="562" y="732" class="title">Keyword Search</text>
  <text x="562" y="750" class="subtitle">BM25 ranking</text>
  <text x="562" y="768" class="subtitle">(exact term matching)</text>

  <rect x="290" y="850" width="300" height="70" rx="14" class="box"/>
  <g transform="translate(306,861)">
    <path d="M2 3 H22 L14 13 V20 L10 22 V13 Z" class="icon"/>
  </g>
  <text x="342" y="882" class="title">Merged Context</text>
  <text x="342" y="900" class="subtitle">Top-ranked chunks combined</text>

  <rect x="290" y="980" width="300" height="80" rx="14" class="box"/>
  <g transform="translate(306,996)">
    <rect x="5" y="5" width="14" height="14" rx="2" class="icon"/>
    <line x1="9" y1="1" x2="9" y2="5" class="icon"/>
    <line x1="15" y1="1" x2="15" y2="5" class="icon"/>
    <line x1="9" y1="19" x2="9" y2="23" class="icon"/>
    <line x1="15" y1="19" x2="15" y2="23" class="icon"/>
    <line x1="1" y1="9" x2="5" y2="9" class="icon"/>
    <line x1="1" y1="15" x2="5" y2="15" class="icon"/>
    <line x1="19" y1="9" x2="23" y2="9" class="icon"/>
    <line x1="19" y1="15" x2="23" y2="15" class="icon"/>
  </g>
  <text x="342" y="1012" class="title">LLM Generation</text>
  <text x="342" y="1030" class="subtitle">Groq API — Llama / GPT-OSS models</text>

  <rect x="290" y="1130" width="300" height="80" rx="14" class="box"/>
  <g transform="translate(306,1146)">
    <circle cx="12" cy="12" r="10" class="icon"/>
    <path d="M7 12 L10.5 15.5 L17 8" class="icon"/>
  </g>
  <text x="342" y="1162" class="title">Output Validator</text>
  <text x="342" y="1180" class="subtitle">Groundedness check before reply</text>

  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M440,160 L440,230">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="452" y="200" class="edgelabel">HTTP POST</text>

  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M440,310 L440,380">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="452" y="350" class="edgelabel">raw message</text>

  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M440,460 L440,530">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="452" y="500" class="edgelabel">sanitized query</text>

  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M420,610 C 380,650 280,660 235,700">
    <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M460,610 C 520,650 610,660 655,700">
    <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <text x="440" y="695" text-anchor="middle" class="section">HYBRID RETRIEVAL — RECIPROCAL RANK FUSION</text>

  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M240,790 C 270,820 340,830 400,850">
    <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M640,790 C 610,820 540,830 480,850">
    <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M440,920 L440,980">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="452" y="955" class="edgelabel">ranked context</text>

  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M440,1060 L440,1130">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="452" y="1100" class="edgelabel">draft answer</text>

  <path class="flow" stroke-dasharray="6 6" marker-end="url(#arrow)" d="M590,1170 C 850,1170 850,120 590,120">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <text x="800" y="650" text-anchor="middle" class="edgelabel" transform="rotate(90 800 650)">validated response</text>
</svg>
